# Single source for the FAQ. Both the floating FAQ pop-up (on every page)
# and the full FAQ page (/faq.html) are built from this file.
# To add a question: copy an existing "- q: / a:" pair into the right section.
# Answers are HTML, so use <a href="/pricing.html">...</a> for links.

- section: "Quick Terms"
  items:
    - q: "What is multispectral imagery?"
      a: "A multispectral camera records specific bands of light, including some you can't see, like red-edge and near-infrared. Healthy plants reflect a lot of near-infrared light; stressed plants reflect less. That difference shows up on the map before the problem is easy to spot from the ground. The DJI Mavic 3 Multispectral captures green, red, red-edge and near-infrared bands, plus a regular color camera."
    - q: "What is NDVI?"
      a: "NDVI (Normalized Difference Vegetation Index) compares near-infrared and red light to score how green and vigorous the plants are across the field. It's a good overall health and stand check, especially earlier in the season."
    - q: "What is NDRE?"
      a: "NDRE (Normalized Difference Red Edge) uses red-edge light instead of red. It sees deeper into thick canopy than NDVI, so it's more useful mid to late season and for spotting nitrogen-related stress."
    - q: "What is an orthomosaic?"
      a: "Hundreds of overlapping drone photos stitched and corrected into one accurate, to-scale map of the whole field or site. You can measure distances and areas right on it."
    - q: "What is a zone map?"
      a: "A field split into areas with similar crop health. Zones tell you where to scout, where to pull soil samples, and where a variable-rate or spot application could pay off. You and your agronomist decide what each zone gets."
    - q: "What does \"spray-ready\" mean?"
      a: "The zone map is exported in the file format your agronomist's software or your spray operator's system already reads, so it loads without retyping or redrawing anything. Rates are still set by you and your agronomist."
    - q: "What is RTK?"
      a: "RTK (Real-Time Kinematic) is a GPS correction that pins each photo down to within a few centimeters. Maps line up with your equipment and with flights from earlier in the season, so you can compare the same spot over time."
    - q: "What is ground-truthing?"
      a: "Walking out to the spots the map flags to see what's actually causing the problem: weeds, insects, disease, drainage, or a planter skip. The map shows you where to look; ground-truthing tells you why."
    - q: "How is this different from satellite images?"
      a: "Drone maps are far sharper, down to a few centimeters per pixel instead of several meters, so you can see individual rows and small problem spots. A drone also flies under the clouds, on your schedule, instead of waiting for a clear satellite pass."
    - q: "What is FAA Part 107?"
      a: "The FAA rule for commercial drone flights. It requires an FAA-certified remote pilot and sets limits on altitude, airspace, and flying over people. Any paid drone work has to be flown under Part 107."
    - q: "What is LAANC?"
      a: "LAANC (Low Altitude Authorization and Notification Capability) is how drone pilots get FAA permission to fly in controlled airspace near airports, like the area around Hutchinson Regional Airport."

- section: "Service & Area"
  items:
    - q: "Where do you fly?"
      a: "Apex Vector is based in Hutchinson and serves Reno County and the surrounding counties of central Kansas. Travel within Reno County is included in every quote; jobs outside the county include a travel charge, quoted up front."
    - q: "What services do you offer?"
      a: "Multispectral crop-health mapping and field mapping, structure and roof inspections, construction and site mapping, and aerial photos and 4K video. Ag mapping is the specialty. See <a href=\"/operations.html\">Flight Operations</a> for how each job is run."
    - q: "Are you licensed and insured?"
      a: "Every commercial flight is flown under FAA Part 107 rules by the Remote Pilot in Command, with drone liability insurance in place for the job. Proof of insurance is available on request before your flight."

- section: "Crop-Health Mapping"
  items:
    - q: "What do I get from a crop-health flight?"
      a: "A high-resolution map of the whole field plus NDVI and NDRE crop-health maps from the multispectral camera. These show stress, stand gaps, and drainage problems before they're easy to see from the ground. Zone maps are delivered spray-ready, in the file format your agronomist or spray operator already uses."
    - q: "Do you spray, or set my application rates?"
      a: "No. Apex Vector supplies the data: maps, zones, and suggested spots to ground-truth or soil sample. You and your agronomist decide what to do and set the rates. If you use a spray drone operator, the zone files are built to hand straight to them."
    - q: "How do I receive my maps?"
      a: "As a download, or on a USB drive ready for your cab. Sales tax may apply to physical copies such as USB drives or prints."

- section: "Pricing & Payment"
  items:
    - q: "How much does it cost?"
      a: "Ag mapping is priced per acre, inspections per structure, and media by the hour, with a minimum charge for small jobs. Use the estimator on <a href=\"/pricing.html\">Rates &amp; Options</a> for a ballpark. Your final quote is confirmed after an airspace review and site survey."
    - q: "How does payment work?"
      a: "Jobs are billed in three steps: 30% when you sign the agreement, 40% when the flying is done, and 30% when your files are ready. Your files are released once the final payment clears."

- section: "Scheduling & Weather"
  items:
    - q: "What happens if it's too windy?"
      a: "This is Kansas, so wind decides a lot. The pilot has final say on whether it's safe to fly. If wind, weather, or visibility rules out your date, the flight is moved to the next good window. Flight dates are confirmed 24 to 48 hours ahead, worked around your schedule."
    - q: "Do I need to be there on flight day?"
      a: "Not necessarily. Before the first flight we walk the site together to note the launch spot, power lines, livestock, and other hazards. On flight day you're welcome to watch from outside the 25-foot safety boundary."
    - q: "Can you fly near the Hutchinson airport?"
      a: "Often, yes. Flights in controlled airspace near Hutchinson Regional Airport (KHUT) require FAA authorization, which is requested and confirmed before your flight is scheduled."

- section: "Data & Privacy"
  items:
    - q: "Who can see my field data?"
      a: "You. Your data is never sold or shared with marketers. It is kept in encrypted storage and shared only with your consent. Your images are used publicly, for example on this website, only if you give permission. Full details are in the <a href=\"/privacy.html\">Privacy Policy</a>."
    - q: "Will the drone bother my neighbors or livestock?"
      a: "Flight plans stay on the authorized property and respect property lines, neighbors' privacy, and livestock. Cameras are not aimed at neighboring homes or people. If a flight catches the edge of a neighbor's field, home, vehicles, or people by accident, that area is cropped out or blurred in your finished files, and it is never shared, sold, or used for anything else."

- section: "About Apex Vector"
  items:
    - q: "Who runs Apex Vector?"
      a: "Travis Cloke, a 10-year U.S. Army aviation veteran who worked on CH-47 Chinook helicopters, and a member of Vets to Drones. The same checklists and maintenance discipline from Army aviation go into every job."
