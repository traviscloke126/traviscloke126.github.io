<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Apex Vector LLC</title>
    <style>
        /* Custom Tactical Aviation Styling */
        :root {
            --bg-color: #1A1F24;
            --card-bg: #232B32;
            --text-primary: #FFFFFF;
            --text-secondary: #A0ADB8;
            --accent-border: #3D4A56;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-family);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        /* Top Flight Navigation Control */
        .flight-nav {
            background-color: var(--card-bg);
            border-bottom: 2px solid var(--accent-border);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: var(--text-primary);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        /* Main Structural Grid Container */
        .mission-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Automating Markdown styling overrides safely */
        h1, h2, h3 {
            color: var(--text-primary);
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        h1 { border-bottom: 1px solid var(--accent-border); padding-bottom: 10px; margin-bottom: 30px; }
        
        p, li {
            color: var(--text-secondary);
            font-size: 1.05rem;
        }

        strong { color: var(--text-primary); }

        ul { padding-left: 20px; }

        li { margin-bottom: 8px; }

        /* Custom Content Card Layout Blocks */
        hr {
            border: 0;
            border-top: 1px solid var(--accent-border);
            margin: 40px 0;
        }

        /* Responsive Graphic Optimization */
        .site-logo {
            max-width: 320px;
            height: auto;
            display: block;
            margin: 30px auto;
            border: 1px solid var(--accent-border);
            padding: 15px;
            background-color: #232B32;
            border-radius: 6px;
        }

        /* Footer Metadata Frame */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: #627280;
            font-size: 0.85rem;
            border-top: 1px solid var(--accent-border);
            margin-top: 60px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar Object -->
    <nav class="flight-nav">
        <a href="{{ '/' | relative_url }}" class="nav-brand">APEX VECTOR</a>
        <div class="nav-links">
            <a href="{{ '/' | relative_url }}">Mission Brief</a>
            <a href="{{ '/operations.html' | relative_url }}">Flight Operations</a>
            <a href="{{ '/safety.html' | relative_url }}">Airworthiness & Safety</a>
            <a href="{{ '/contact.html' | relative_url }}">Request Operations</a>
        </div>
    </nav>

    <!-- Main Content Frame -->
    <main class="mission-container">
        {{ content }}
    </main>

    <!-- Corporate Footer -->
    <footer>
        Apex Vector LLC &bull; Reno County, Kansas &bull; Operating under 14 C.F.R. Part 107 Protocols
    </footer>

</body>
</html>
