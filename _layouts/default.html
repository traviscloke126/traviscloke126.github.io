<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Apex Vector LLC</title>
    <style>
        :root {
            --bg-color: #111416;
            --card-bg: #1B2126;
            --text-primary: #FFFFFF;
            --text-secondary: #9EB1C2;
            --accent-amber: #FFB300;
            --accent-amber-hover: #E5A100;
            --accent-border: #2C3740;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-family);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        /* Flight Navigation Bar */
        .flight-nav {
            background-color: #161B1F;
            border-bottom: 1px solid var(--accent-border);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 1.5px;
            color: var(--text-primary);
            text-decoration: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            margin-left: 20px;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover { color: var(--text-primary); }

        .mission-container {
            max-width: 960px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Typography Controls */
        h1, h2, h3 { color: var(--text-primary); font-weight: 600; }
        h1 { font-size: 2.2rem; line-height: 1.2; margin-bottom: 20px; }
        h2 { font-size: 1.75rem; border-bottom: 1px solid var(--accent-border); padding-bottom: 8px; margin-top: 40px; }
        p, li { color: var(--text-secondary); font-size: 1.05rem; }
        strong { color: var(--text-primary); }

        /* The Hero Framework */
        .hero-section { text-align: center; padding: 40px 0 20px; }
        .hero-headline { font-size: 2.5rem; font-weight: 700; line-height: 1.2; margin-bottom: 15px; }
        .hero-subheadline { font-size: 1.2rem; color: var(--text-secondary); max-width: 800px; margin: 0 auto 30px; }
        
        .cta-group { display: flex; gap: 15px; justify-content: center; margin-bottom: 40px; }
        .btn-primary { background-color: var(--accent-amber); color: #111416; padding: 12px 28px; text-decoration: none; font-weight: 700; border-radius: 4px; transition: background 0.2s; }
        .btn-primary:hover { background-color: var(--accent-amber-hover); }
        .btn-secondary { border: 1px solid var(--accent-border); color: var(--text-primary); padding: 12px 28px; text-decoration: none; font-weight: 600; border-radius: 4px; transition: background 0.2s; }
        .btn-secondary:hover { background-color: rgba(255,255,255,0.05); }

                /* Precision Graphic Crop & Optimization */
        .site-logo {
            max-width: 260px;
            height: 240px; /* Locks the height strictly to the shield area */
            object-fit: cover; /* Keeps the shield from stretching */
            object-position: top; /* Clips off the lower text duplicate cleanly */
            display: block;
            margin: 0 auto 20px;
            background: transparent;
        }


        /* Three Pillars Visual Cards Grid */
        .pillar-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 30px; }
        @media (min-width: 768px) { .pillar-grid { grid-template-columns: 1fr 1fr 1fr; } }
        
        .pillar-card { background-color: var(--card-bg); border: 1px solid var(--accent-border); padding: 25px; border-radius: 6px; }
        .pillar-card h3 { margin-top: 0; color: var(--accent-amber); font-size: 1.25rem; border-bottom: 1px solid var(--accent-border); padding-bottom: 8px; }
        .pillar-meta { font-size: 0.85rem; color: #627280; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; display: block; }
        .pillar-standard { font-size: 0.9rem; border-left: 2px solid var(--accent-amber); padding-left: 10px; margin-top: 15px; font-style: italic; }

        /* Maintenance Checklist Layout */
        .advantage-box { background-color: #14191D; border: 1px dashed var(--accent-border); padding: 25px; border-radius: 6px; margin-top: 20px; }
        .advantage-box ol { padding-left: 20px; margin-bottom: 0; }
        .advantage-box li { margin-bottom: 12px; }

        /* The Founder Handshake Block */
        .founder-section { display: flex; flex-direction: column; gap: 20px; background-color: var(--card-bg); border: 1px solid var(--accent-border); padding: 30px; border-radius: 6px; margin-top: 50px; }
        @media (min-width: 768px) { .founder-section { flex-direction: row; align-items: center; } }
        .founder-img { width: 120px; height: 120px; background-color: var(--accent-border); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; color: var(--text-secondary); flex-shrink: 0; margin: 0 auto; object-fit: cover; }
        .founder-bio h3 { margin-top: 0; margin-bottom: 5px; }
        .founder-title { font-size: 0.9rem; color: var(--accent-amber); display: block; margin-bottom: 10px; font-weight: 600; }

        /* Trust Badges Footer */
        .trust-badges { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 40px; }
        .badge { background-color: #161B1F; border: 1px solid var(--accent-border); color: var(--text-primary); padding: 6px 14px; font-size: 0.8rem; font-weight: 600; border-radius: 4px; letter-spacing: 0.5px; }
        .badge.gold { border-color: var(--accent-amber); color: var(--accent-amber); }

        footer { text-align: center; padding: 40px 20px 60px; color: #526270; font-size: 0.85rem; border-top: 1px solid var(--accent-border); margin-top: 40px; }
    </style>
</head>
<body>

    <nav class="flight-nav">
        <a href="{{ '/' | relative_url }}" class="nav-brand">APEX VECTOR</a>
        <div class="nav-links">
            <a href="{{ '/' | relative_url }}">Mission Brief</a>
            <a href="{{ '/operations.html' | relative_url }}">Flight Operations</a>
            <a href="{{ '/safety.html' | relative_url }}">Airworthiness & Safety</a>
            <a href="{{ '/contact.html' | relative_url }}">Request Operations</a>
        </div>
    </nav>

    <main class="mission-container">
        {{ content }}
    </main>

    <footer>
        <div class="trust-badges">
            <div class="badge gold">🇺🇸 Veteran-Owned Small Business</div>
            <div class="badge">🦅 FAA Part 107 Certified</div>
            <div class="badge">🛡️ Fully Insured up to $1,000,000</div>
        </div>
        <br><br>
        Apex Vector LLC &bull; Reno County, Kansas &bull; Operating under 14 C.F.R. Part 107 Protocols
    </footer>

</body>
</html>
